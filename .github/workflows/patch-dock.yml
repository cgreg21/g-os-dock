name: Apply dock layout and smart-hide fixes
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-dock.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch TypeScript source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("src/dockView.ts")
          source = path.read_text()

          source, count = re.subn(
              r"(        const position = this\.settings\.get_string\('dock-position'\);\n)(        const \[minWidth, naturalWidth\] = this\.actor\.get_preferred_width\(-1\);)",
              r"\1        const vertical = position === 'left' || position === 'right';\n        this.actor.set_vertical(vertical);\n\2",
              source, count=1)
          assert count == 1, "Could not patch dock orientation measurement"

          source, count = re.subn(
              r"        const vertical = position === 'left' \|\| position === 'right';\n        this\.actor\.set_vertical\(vertical\);\n        this\.actor\.set_position\(x, y\);",
              "        this.actor.set_position(x, y);",
              source, count=1)
          assert count == 1, "Could not remove late orientation change"

          source, count = re.subn(
              r"        if \(!this\.settings\.get_boolean\('auto-hide'\)\) \{\n.*?\n        if \(this\.settings\.get_boolean\('smart-hide'\)\)\n            this\.queueSmartHideCheck\(\);",
              """        const autoHide = this.settings.get_boolean('auto-hide');
                  const smartHide = this.settings.get_boolean('smart-hide');
                  if (!autoHide && !smartHide) {
                      this.cancelHide();
                      this.actor.show();
                      this.actor.opacity = 255;
                  } else if (autoHide) {
                      this.scheduleHide();
                  }

                  // Keep a reveal sensor available when either hiding mode is enabled.
                  if (autoHide || smartHide) {
                      this.edgeSensor.show();
                      this.positionSensor();
                  } else {
                      this.edgeSensor.hide();
                  }
                  if (smartHide)
                      this.queueSmartHideCheck();""",
              source, count=1, flags=re.S)
          assert count == 1, "Could not patch smart-hide sensor behavior"
          path.write_text(source)
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/dockView.ts
          git diff --cached --quiet && exit 0
          git commit -m "Fix vertical dock layout and smart-hide recovery"
          git push
