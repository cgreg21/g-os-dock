name: Import source files into repository
on:
  push:
    branches: [main]
    paths:
      - 'g-os-dock-source.zip'
      - '.github/workflows/import-sources.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract source tree
        run: |
          test -f g-os-dock-source.zip
          mkdir -p /tmp/g-os-dock-source
          unzip -q g-os-dock-source.zip -d /tmp/g-os-dock-source
          # Keep repository-managed workflows: the GitHub App token cannot
          # push workflow-file changes without the separate workflows scope.
          rm -rf /tmp/g-os-dock-source/.github
          cp -a /tmp/g-os-dock-source/. .
          rm g-os-dock-source.zip
      - name: Commit individual source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import G-OS Dock source files"
          git push
