name: Build G-OS Dock
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y zip libglib2.0-bin
      - run: npm install
      - run: npm run check
      - run: npm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: g-os-dock-gnome-extension
          path: g-os-dock@cgreg21.github.io.zip
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          draft: false
          generate_release_notes: true
          files: g-os-dock@cgreg21.github.io.zip
